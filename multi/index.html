<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Метка ×4 — четыре видео</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="multi.css?v=2"></head><body>
<section id="grid" aria-label="Четыре видео"></section><aside class="sidebar">
<header><div class="brand"><span class="logo">▦</span> метка <span class="badge">×4</span><small>ЧЕТЫРЕ ВИДЕО · ОДИН ПОТОК</small></div><div class="files"><label class="button">Открыть 1–4 видео<input id="files" type="file" accept="video/*,.mkv,.avi,.mov" multiple></label><label class="speed">Скорость <input id="speed" type="number" min="0.1" max="100" step="0.1" value="20"> ×</label></div></header>
<section class="command"><div id="hint"><span class="key">Пробел</span> пауза и новая метка <span class="muted">· 1 ↖ &nbsp; 2 ↗ &nbsp; 3 ↙ &nbsp; 4 ↘</span></div><form id="entry" hidden><span class="record-dot"></span><input id="text" autocomplete="off" aria-label="Номер видео и текст метки" placeholder="1 Текст метки. Следующее предложение"><button class="primary">Сохранить ↵</button><button type="button" id="cancel">Продолжить · Esc</button></form><span id="state">ВЫБЕРИТЕ ВИДЕО</span></section>
<section id="videoInfo" aria-label="Информация о видео"></section><section class="bottom"><span id="status">Видео и метки остаются только на вашем компьютере.</span><div><button id="toggle" disabled>▶ Начать</button><button id="resultsBtn">Список меток <span id="total">0</span></button></div></section>
</aside><dialog id="results"><div class="results-head"><div><h2>Ваши таймкоды</h2><p>Отдельный список для каждого видео</p></div><button id="close">×</button></div><div id="resultLists"></div><div class="results-footer"><button id="exportAll" class="primary">↓ Скачать все TXT</button><button id="return">Вернуться к видео</button></div></dialog>
<script src="core.js"></script><script src="app.js?v=2"></script></body></html>
