<!doctype html><meta charset="utf-8"><button id="run">Проверить быстрое аудио</button><pre id="status">Готов</pre><script src="../ai-core.js"></script><script src="../fast-audio.js"></script><script>
function aiMessage(s){document.getElementById('status').textContent=s}document.getElementById('run').onclick=async()=>{let engine;try{const file=new File([await(await fetch('fast-audio.m4a')).arrayBuffer()],'sample.m4a');const signal=new AbortController().signal;const begin=performance.now();engine=await createFastAudio(file,signal);const bytes=await engine.extract(0,22,signal);const wav=AICore.readWav(bytes),detector=new AICore.SilenceDetector();detector.feed(wav.samples,wav.rate,0);const intervals=detector.finish();aiMessage((intervals.some(s=>s.end-s.start>=15)?'PASS':'FAIL')+'; 22 секунды аудио обработаны за '+((performance.now()-begin)/1000).toFixed(2)+' с; тишина: '+JSON.stringify(intervals))}catch(e){aiMessage('FAIL: '+e.message)}finally{engine?.terminate()}};
</script>
